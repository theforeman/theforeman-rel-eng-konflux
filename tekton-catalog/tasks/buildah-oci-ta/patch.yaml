---
# JSON 6902 patch for the buildah-oci-ta task.
#
# Upstream task steps (0-based indices used below):
# curl -Ls "$URL" | yq ".spec.steps.[].name" | nl -v0
#      0  use-trusted-artifact
#      1  build
#      2  push
#      3  exclude-git-annex (Foreman)
#      4  sbom-syft-generate
#      5  prepare-sboms
#      6  upload-sbom

# Set a low stepTemplate baseline so steps without explicit resources
# don't silently consume large allocations.
- op: replace
  path: /spec/stepTemplate/computeResources
  value:
    limits:
      memory: 256Mi
    requests:
      memory: 128Mi

# use-trusted-artifact has no computeResources set upstream; it inherits
# from stepTemplate (256Mi is sufficient for extracting trusted artifacts).

# build: large Foreman image requires substantial memory.
- op: replace
  path: /spec/steps/1/computeResources
  value:
    limits:
      cpu: 4600m
      memory: 16Gi
    requests:
      cpu: 4600m
      memory: 16Gi

# push
- op: replace
  path: /spec/steps/2/computeResources
  value:
    limits:
      cpu: 600m
      memory: 1Gi
    requests:
      cpu: 600m
      memory: 128Mi

# Remove Git Annex's content-addressed objects before the source SBOM scan.
# These objects are build metadata, are not copied into the image, and can
# contain paths that Syft cannot index as regular files.
- op: add
  path: /spec/steps/3
  value:
    name: exclude-git-annex
    image: quay.io/konflux-ci/task-runner:1.6.0@sha256:1abfe4e50d4e961d0fd9790202565f93ee650fe8dfc50932c94989acba10485f
    script: |
      #!/usr/bin/env bash
      set -euo pipefail

      annex_dir=/var/workdir/source/images/pulp-source/pulpcore-packaging/.git/annex
      if [[ -d "${annex_dir}" ]]; then
        echo "Removing Git Annex metadata from the source SBOM scan: ${annex_dir}"
        rm -rf -- "${annex_dir}"
      else
        echo "Git Annex metadata directory not present: ${annex_dir}"
      fi
    securityContext:
      runAsUser: 0

# sbom-syft-generate: OOM failure observed at the upstream 4Gi limit.
- op: replace
  path: /spec/steps/4/computeResources
  value:
    limits:
      cpu: 1100m
      memory: 8Gi
    requests:
      cpu: 1100m
      memory: 128Mi

# prepare-sboms
- op: replace
  path: /spec/steps/5/computeResources
  value:
    limits:
      cpu: 100m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi

# upload-sbom
- op: replace
  path: /spec/steps/6/computeResources
  value:
    limits:
      cpu: 100m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
