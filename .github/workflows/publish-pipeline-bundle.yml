---
name: Publish Pipeline Bundles

on:
  push:
    branches:
      - develop
    paths:
      - 'tekton-catalog/**'
  workflow_dispatch:

jobs:
  publish-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Install tkn CLI
        run: |
          TKN_VERSION=0.39.0
          curl -Ls "https://github.com/tektoncd/cli/releases/download/v${TKN_VERSION}/tkn_${TKN_VERSION}_Linux_x86_64.tar.gz" \
            | tar xz tkn
          sudo mv tkn /usr/local/bin/
          tkn version

      - name: Login to Quay.io
        uses: redhat-actions/podman-login@v1
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Copy credentials to Docker config for tkn
        run: |
          mkdir -p ~/.docker
          cp "${REGISTRY_AUTH_FILE}" ~/.docker/config.json

      - name: Verify Quay.io push access
        env:
          QUAY_ROBOT_USERNAME: ${{ secrets.QUAY_ROBOT_USERNAME }}
          QUAY_ROBOT_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
        run: |
          REPO=foreman/tekton-catalog/pipeline-push-to-external-registry
          SCOPE="repository:${REPO}:push,pull"
          TOKEN=$(curl -s -u "${QUAY_ROBOT_USERNAME}:${QUAY_ROBOT_TOKEN}" \
            "https://quay.io/v2/auth?service=quay.io&scope=${SCOPE}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('token',''))")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://quay.io/v2/${REPO}/blobs/uploads/")
          echo "Blob upload start HTTP status: ${STATUS}"
          if [ "${STATUS}" != "202" ]; then
            echo "Expected 202, got ${STATUS} — robot account lacks push permission on this repo"
            exit 1
          fi

      - name: Build and push push-to-external-registry bundle
        id: push_bundle
        run: |
          BUNDLE_REF=quay.io/foreman/tekton-catalog/pipeline-push-to-external-registry:latest
          kustomize build tekton-catalog/pipelines/push-to-external-registry/ \
            | tkn bundle push "${BUNDLE_REF}" -f -
          DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${BUNDLE_REF}")
          echo "bundle_digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "Published ${BUNDLE_REF}@${DIGEST}"
