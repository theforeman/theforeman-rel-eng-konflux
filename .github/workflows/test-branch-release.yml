---
name: Test branch-release scripts

on:
  push:
    branches:
      - develop
    paths:
      - 'hack/branch-release/**'
      - '.github/workflows/test-branch-release.yml'
  pull_request:
    paths:
      - 'hack/branch-release/**'
      - '.github/workflows/test-branch-release.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run tests
        run: uv run --with pytest pytest hack/branch-release/tests/ -v

      - name: Lint
        run: uv run --with ruff ruff check hack/branch-release/
